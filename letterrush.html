<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚡ Letter Rush – Word Swap</title>
    <!-- Google Fonts for a modern, playful look -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
            /* Vibrant animated background */
            background: radial-gradient(circle at 10% 20%, #0b1120, #1a2639);
            position: relative;
            overflow-x: hidden;
        }

        /* Animated glowing orbs in the background */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
            animation: float 12s ease-in-out infinite alternate;
        }

        body::before {
            width: 600px;
            height: 600px;
            background: #f093fb;
            top: -150px;
            left: -150px;
        }

        body::after {
            width: 500px;
            height: 500px;
            background: #4facfe;
            bottom: -100px;
            right: -100px;
            animation-delay: 4s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(80px, 60px) scale(1.2);
            }
        }

        /* ---------- GAME CONTAINER ---------- */
        .game-container {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 56px;
            padding: 28px 32px 36px;
            width: 100%;
            max-width: 680px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 255, 255, 0.06) inset;
            transition: all 0.3s ease;
        }

        /* ---------- HEADER ---------- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .header h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200, #f7971e);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s ease-in-out infinite;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .header h1 .emoji {
            -webkit-text-fill-color: initial;
            font-size: 32px;
        }

        .level-badge {
            background: linear-gradient(135deg, rgba(255, 215, 100, 0.25), rgba(255, 170, 80, 0.15));
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            color: #ffd966;
            border: 1px solid rgba(255, 215, 100, 0.2);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 20px rgba(255, 215, 100, 0.05);
        }

        .level-badge .letters {
            color: #7eddd6;
            font-weight: 800;
            background: rgba(78, 205, 196, 0.15);
            padding: 2px 10px;
            border-radius: 30px;
        }

        .level-timer {
            font-size: 16px;
            font-weight: 700;
            color: #b0c4e8;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            box-shadow: 0 0 15px rgba(0, 200, 255, 0.05);
        }

        .turn-area {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .turn-indicator {
            font-size: 14px;
            font-weight: 700;
            padding: 6px 20px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.04);
            color: #c8d8f0;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
        }

        .turn-indicator.player-turn {
            background: rgba(78, 205, 196, 0.15);
            color: #7eddd6;
            border-color: rgba(78, 205, 196, 0.3);
            box-shadow: 0 0 30px rgba(78, 205, 196, 0.08), 0 0 60px rgba(78, 205, 196, 0.04);
        }

        .turn-indicator.computer-turn {
            background: rgba(255, 170, 80, 0.12);
            color: #fbb85e;
            border-color: rgba(255, 170, 80, 0.2);
            box-shadow: 0 0 30px rgba(255, 170, 80, 0.05);
        }

        .timer-display {
            font-size: 28px;
            font-weight: 800;
            color: #f0f4fe;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 22px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-width: 76px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            font-family: 'Fredoka One', cursive;
            text-shadow: 0 0 20px rgba(78, 205, 196, 0.1);
            transition: all 0.3s ease;
        }

        .timer-display.warning {
            color: #ff6b6b;
            border-color: rgba(255, 90, 90, 0.3);
            box-shadow: 0 0 40px rgba(255, 90, 90, 0.15);
            animation: pulse 0.6s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.05);
                opacity: 0.7;
            }
        }

        /* ---------- PROGRESS SECTION ---------- */
        .progress-section {
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .progress-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .progress-label {
            font-size: 15px;
            font-weight: 700;
            color: #b0c4e8;
            letter-spacing: 0.3px;
        }

        .progress-label .count {
            color: #f0f4fe;
            font-size: 20px;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.05);
            padding: 0 12px;
            border-radius: 30px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.03);
        }

        .progress-bar-fill {
            height: 100%;
            border-radius: 20px;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 0%;
            background: linear-gradient(90deg, #f093fb, #f5576c, #4facfe, #00f2fe);
            background-size: 300% 100%;
            animation: gradientMove 3s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.2);
        }

        @keyframes gradientMove {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* ---------- WORD DISPLAY ---------- */
        .word-display {
            display: flex;
            justify-content: center;
            gap: 14px;
            padding: 28px 10px 32px;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 32px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            min-height: 110px;
            align-items: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.2);
        }

        .letter-tile {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 62px;
            height: 70px;
            font-size: 38px;
            font-weight: 800;
            font-family: 'Fredoka One', cursive;
            color: #fff;
            text-transform: uppercase;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            user-select: none;
            position: relative;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* Vibrant rainbow tiles */
        .letter-tile:nth-child(6n+1) {
            background: linear-gradient(145deg, #ff6b6b, #ee5a24);
            box-shadow: 0 8px 24px rgba(238, 90, 36, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }
        .letter-tile:nth-child(6n+2) {
            background: linear-gradient(145deg, #feca57, #f9ca24);
            box-shadow: 0 8px 24px rgba(249, 202, 36, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }
        .letter-tile:nth-child(6n+3) {
            background: linear-gradient(145deg, #48dbfb, #0abde3);
            box-shadow: 0 8px 24px rgba(10, 189, 227, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }
        .letter-tile:nth-child(6n+4) {
            background: linear-gradient(145deg, #1dd1a1, #10ac84);
            box-shadow: 0 8px 24px rgba(16, 172, 132, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }
        .letter-tile:nth-child(6n+5) {
            background: linear-gradient(145deg, #a29bfe, #6c5ce7);
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }
        .letter-tile:nth-child(6n+6) {
            background: linear-gradient(145deg, #fd79a8, #e84393);
            box-shadow: 0 8px 24px rgba(232, 67, 147, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }

        .letter-tile.highlight-remove {
            filter: brightness(1.5) saturate(0.5);
            transform: scale(0.85) rotate(-5deg);
            border-color: #ff6b6b;
            box-shadow: 0 0 40px rgba(255, 90, 90, 0.4);
        }

        .letter-tile.highlight-add {
            filter: brightness(1.5);
            transform: scale(1.12) rotate(3deg);
            border-color: #7eddd6;
            box-shadow: 0 0 50px rgba(78, 205, 196, 0.5);
        }

        .letter-tile.clickable {
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .letter-tile.clickable:hover {
            transform: translateY(-6px) scale(1.04);
            filter: brightness(1.15);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .letter-tile.clickable:active {
            transform: scale(0.92);
            filter: brightness(0.9);
        }

        /* ---------- MESSAGE AREA ---------- */
        .message-area {
            text-align: center;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            padding: 0 6px;
        }

        .message {
            font-size: 16px;
            font-weight: 700;
            color: #c8d8f0;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 28px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(4px);
        }

        .message.success {
            color: #7eddd6;
            background: rgba(78, 205, 196, 0.1);
            border-color: rgba(78, 205, 196, 0.15);
            box-shadow: 0 0 30px rgba(78, 205, 196, 0.05);
        }

        .message.error {
            color: #ff8a8a;
            background: rgba(255, 90, 90, 0.08);
            border-color: rgba(255, 90, 90, 0.12);
        }

        .message.info {
            color: #fbb85e;
            background: rgba(255, 170, 80, 0.08);
            border-color: rgba(255, 170, 80, 0.12);
        }

        .message.game-over {
            color: #ffb3b3;
            background: rgba(255, 200, 200, 0.06);
            border-color: rgba(255, 200, 200, 0.08);
            font-size: 20px;
            font-weight: 800;
        }

        .message.level-up {
            color: #7eddd6;
            background: rgba(78, 205, 196, 0.12);
            border-color: rgba(78, 205, 196, 0.2);
            font-size: 20px;
            font-weight: 800;
            animation: bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ---------- INPUT AREA ---------- */
        .input-area {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
            align-items: center;
            flex-wrap: wrap;
        }

        .input-area input {
            flex: 1;
            min-width: 140px;
            padding: 14px 22px;
            font-size: 22px;
            font-weight: 700;
            font-family: 'Nunito', sans-serif;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.3);
            color: #f0f4fe;
            outline: none;
            transition: all 0.25s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        .input-area input::placeholder {
            color: rgba(255, 255, 255, 0.15);
            font-weight: 600;
            font-size: 18px;
            letter-spacing: 0;
            text-transform: none;
        }

        .input-area input:focus {
            border-color: rgba(78, 205, 196, 0.4);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 40px rgba(78, 205, 196, 0.06), 0 0 0 1px rgba(78, 205, 196, 0.1) inset;
        }

        .input-area input:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn {
            padding: 14px 28px;
            font-size: 18px;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 90px;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent);
            pointer-events: none;
            border-radius: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #fff;
            box-shadow: 0 8px 32px rgba(79, 172, 254, 0.25);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 40px rgba(79, 172, 254, 0.35);
        }

        .btn-primary:active:not(:disabled) {
            transform: scale(0.95);
        }

        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
            box-shadow: 0 8px 32px rgba(245, 87, 108, 0.2);
        }

        .btn-secondary:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 40px rgba(245, 87, 108, 0.3);
        }

        .btn-restart {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a2639;
            box-shadow: 0 8px 32px rgba(247, 151, 30, 0.25);
            padding: 16px 44px;
            font-size: 20px;
        }

        .btn-restart:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 40px rgba(247, 151, 30, 0.35);
        }

        .btn-restart:active {
            transform: scale(0.95);
        }

        /* ---------- STATS ---------- */
        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 4px 4px;
            margin-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
            gap: 8px;
        }

        .score-group {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
        }

        .score-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: 700;
            color: #b0c4e8;
        }

        .score-item .score-value {
            font-size: 26px;
            font-weight: 800;
            color: #f0f4fe;
            min-width: 32px;
            text-align: center;
            font-family: 'Fredoka One', cursive;
            background: rgba(255, 255, 255, 0.03);
            padding: 0 8px;
            border-radius: 12px;
        }

        .score-item .score-label {
            opacity: 0.7;
            font-weight: 600;
        }

        .score-item .badge {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 4px;
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.1);
        }

        .badge-player {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }
        .badge-computer {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .move-counter {
            font-size: 15px;
            color: #8899bb;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.15);
            padding: 4px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ---------- USED WORDS ---------- */
        .used-words {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            padding: 10px 16px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            min-height: 38px;
        }

        .used-words-label {
            font-size: 12px;
            font-weight: 700;
            color: #667799;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-right: 6px;
        }

        .used-word-tag {
            font-size: 14px;
            font-weight: 600;
            color: #b0c4e8;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-transform: lowercase;
            transition: all 0.2s ease;
        }

        .used-word-tag.current {
            color: #7eddd6;
            border-color: rgba(78, 205, 196, 0.15);
            background: rgba(78, 205, 196, 0.06);
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.05);
        }

        /* ---------- GAME OVER OVERLAY ---------- */
        .game-over-overlay {
            display: none;
            text-align: center;
            padding: 20px 10px 8px;
        }

        .game-over-overlay.visible {
            display: block;
            animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .game-over-overlay h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 34px;
            font-weight: 700;
            color: #f0f4fe;
            margin-bottom: 6px;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.05);
        }

        .game-over-overlay .sub {
            font-size: 18px;
            font-weight: 600;
            color: #b0c4e8;
            margin-bottom: 20px;
        }

        /* ---------- WINNER CELEBRATION ---------- */
        .celebration {
            display: none;
            text-align: center;
            padding: 14px 0 8px;
        }

        .celebration.visible {
            display: block;
            animation: confettiDrop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes confettiDrop {
            0% {
                opacity: 0;
                transform: scale(0.8) rotate(-3deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0);
            }
        }

        .celebration .big-emoji {
            font-size: 72px;
            display: block;
            margin-bottom: 6px;
            animation: bounceIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .celebration .win-title {
            font-family: 'Fredoka One', cursive;
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700, #ff6b6b, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 300% 100%;
            animation: shimmer 2s ease-in-out infinite;
            text-shadow: none;
        }

        .celebration .win-sub {
            font-size: 20px;
            font-weight: 600;
            color: #b0c4e8;
            margin-top: 6px;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 580px) {
            .game-container {
                padding: 20px 16px 24px;
                border-radius: 40px;
            }

            .header h1 {
                font-size: 22px;
            }
            .header h1 .emoji {
                font-size: 24px;
            }

            .level-badge {
                font-size: 13px;
                padding: 4px 14px;
                gap: 8px;
            }
            .level-timer {
                font-size: 13px;
                padding: 2px 10px;
            }

            .letter-tile {
                width: 48px;
                height: 54px;
                font-size: 28px;
                border-radius: 14px;

<body>

    <div class="game-container" id="app">
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <h1>
                    <span class="emoji">⚡</span> Letter Rush
                </h1>
                <div class="level-badge" id="levelBadge">
                    Level <span id="levelNum">1</span> · <span class="letters" id="levelLetters">3</span> letters
                    <span class="level-timer" id="levelTimerDisplay">⏱️ 2:00</span>
                </div>
            </div>
            <div class="turn-area">
                <div class="turn-indicator" id="turnIndicator">● Your Turn</div>
                <div class="timer-display" id="turnTimerDisplay">30</div>
            </div>
        </div>

        <!-- PROGRESS -->
        <div class="progress-section">
            <div class="progress-row">
                <span class="progress-label">📖 Words <span class="count" id="progressCount">0 / 10</span></span>
                <span class="progress-label" id="levelStatus">Level 1</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
            </div>
        </div>

        <!-- WORD DISPLAY -->
        <div class="word-display" id="wordDisplay"></div>

        <!-- MESSAGE -->
        <div class="message-area">
            <div class="message" id="message">Swap one letter – 30s per turn!</div>
        </div>

        <!-- INPUT -->
        <div class="input-area">
            <input
            type="text"
            id="wordInput"
            placeholder="New word…"
            maxlength="6"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            />
            <button class="btn btn-primary" id="submitBtn">Swap</button>
            <button class="btn btn-secondary" id="hintBtn">💡 Hint</button>
        </div>

        <!-- STATS -->
        <div class="stats">
            <div class="score-group">
                <div class="score-item">
                    <span class="badge badge-player"></span>
                    <span class="score-label">You</span>
                    <span class="score-value" id="playerScore">0</span>
                </div>
                <div class="score-item">
                    <span class="badge badge-computer"></span>
                    <span class="score-label">Comp</span>
                    <span class="score-value" id="computerScore">0</span>
                </div>
            </div>
            <div class="move-counter" id="moveCounter">Moves 0</div>
        </div>

        <!-- USED WORDS -->
        <div class="used-words" id="usedWords">
            <span class="used-words-label">📝 used:</span>
        </div>

        <!-- CELEBRATION (All levels complete) -->
        <div class="celebration" id="celebration">
            <span class="big-emoji">🏆</span>
            <div class="win-title">🌟 You Win! 🌟</div>
            <div class="win-sub">All 4 levels complete – you're a Letter Rush champion!</div>
        </div>

        <!-- GAME OVER OVERLAY -->
        <div class="game-over-overlay" id="gameOverOverlay">
            <h2 id="gameOverTitle">🏆 Game Over</h2>
            <div class="sub" id="gameOverSub">What a match!</div>
            <button class="btn btn-restart" id="restartBtn">🔄 Play Again</button>
        </div>
    </div>

        // Filter to 3–6 letters
        const ALL_WORDS = RAW_WORDS.filter(w => w.length >= 3 && w.length <= 6);
        const WORD_SET = new Set(ALL_WORDS);

        // ============================================================
        //  LEVEL CONFIG – 4 levels, 3–6 letters, 10 words each, 2min
        // ============================================================
        const LEVELS = [
            { level: 1, wordLength: 3, wordsNeeded: 10, timeSeconds: 120 },
            { level: 2, wordLength: 4, wordsNeeded: 10, timeSeconds: 120 },
            { level: 3, wordLength: 5, wordsNeeded: 10, timeSeconds: 120 },
            { level: 4, wordLength: 6, wordsNeeded: 10, timeSeconds: 120 },
        ];
        const MAX_LEVEL = LEVELS.length;
        const TURN_TIME_LIMIT = 30;

        // ============================================================
        //  GAME STATE
        // ============================================================
        const state = {
            levelIndex: 0,
            wordsCompleted: 0,
            currentWord: '',
            playerScore: 0,
            computerScore: 0,
            moves: 0,
            isPlayerTurn: true,
            gameOver: false,
            usedWords: [],
            message: '',
            messageType: 'info',
            hint: null,
            isProcessing: false,
            levelTimeLeft: 120,
            turnTimeLeft: 30,
            turnTimerActive: false,
            timerInterval: null,
            levelComplete: false,
            allLevelsComplete: false,
        };

        // ============================================================
        //  DOM REFS
        // ============================================================
        const $ = id => document.getElementById(id);
        const wordDisplay = $('wordDisplay');
        const turnIndicator = $('turnIndicator');
        const turnTimerDisplay = $('turnTimerDisplay');
        const levelTimerDisplay = $('levelTimerDisplay');
        const messageEl = $('message');
        const wordInput = $('wordInput');
        const submitBtn = $('submitBtn');
        const hintBtn = $('hintBtn');
        const playerScoreEl = $('playerScore');
        const computerScoreEl = $('computerScore');
        const moveCounter = $('moveCounter');
        const usedWordsEl = $('usedWords');
        const gameOverOverlay = $('gameOverOverlay');
        const gameOverTitle = $('gameOverTitle');
        const gameOverSub = $('gameOverSub');
        const restartBtn = $('restartBtn');
        const levelBadge = $('levelBadge');
        const progressCount = $('progressCount');
        const progressFill = $('progressFill');
        const levelStatus = $('levelStatus');
        const celebration = $('celebration');
        const levelNum = $('levelNum');
        const levelLetters = $('levelLetters');

        // ============================================================
        //  AUDIO – Ticking sound
        // ============================================================
        let audioCtx = null;

        function playTick(high = false) {
            try {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.value = high ? 1200 : 800;
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.08);
            } catch (e) { /* silent fail */ }
        }

        // ============================================================
        //  HELPERS
        // ============================================================
        function isWord(word) { return WORD_SET.has(word.toLowerCase()); }

        function getWordsOfLength(len) { return ALL_WORDS.filter(w => w.length === len); }

        function getNeighbors(word) {
            const result = [];
            const lower = word.toLowerCase();
            const letters = 'abcdefghijklmnopqrstuvwxyz';
            for (let i = 0; i < lower.length; i++) {
                for (const ch of letters) {
                    if (ch === lower[i]) continue;
                    const candidate = lower.slice(0, i) + ch + lower.slice(i + 1);
                    if (candidate.length <= 6 && isWord(candidate) && candidate !== lower) {
                        result.push(candidate);
                    }
                }
            }
            return result;
        }

        function getValidMoves(word, usedSet) {
            const neighbors = getNeighbors(word);
            return neighbors.filter(w => !usedSet.has(w) && w !== word);
        }

        function getLevelConfig() { return LEVELS[state.levelIndex]; }
        function getWordLength() { return getLevelConfig().wordLength; }
        function getWordsNeeded() { return getLevelConfig().wordsNeeded; }
        function getLevelTimeLimit() { return getLevelConfig().timeSeconds; }

        // ============================================================
        //  TIMER MANAGEMENT
        // ============================================================
        function startTimers() {
            clearTimer();
            state.levelTimeLeft = getLevelTimeLimit();
            state.turnTimeLeft = TURN_TIME_LIMIT;
            state.turnTimerActive = state.isPlayerTurn && !state.gameOver && !state.levelComplete;
            updateTimerDisplays();
            state.timerInterval = setInterval(() => {
                state.levelTimeLeft--;
                if (state.turnTimerActive) {
                    state.turnTimeLeft--;
                }
                updateTimerDisplays();

                const turnWarning = state.turnTimerActive && state.turnTimeLeft <= 5;
                const levelWarning = state.levelTimeLeft <= 10;
                playTick(turnWarning || levelWarning);

                if (state.levelTimeLeft <= 0) {
                    clearTimer();
                    if (!state.gameOver && !state.levelComplete) {
                        setGameOver('⏰ Level Time\'s Up!', 'You ran out of level time.');
                        setMessage('⌛ Level time expired!', 'game-over');
                    }
                    return;
                }

                if (state.turnTimerActive && state.turnTimeLeft <= 0) {
                    clearTimer();
                    if (!state.gameOver && !state.levelComplete && state.isPlayerTurn) {
                        setGameOver('⏰ Turn Time\'s Up!', 'You took too long to move.');
                        setMessage('⌛ 30 seconds per turn!', 'game-over');
                    }
                }
            }, 1000);
        }

        function clearTimer() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
        }

        function updateTimerDisplays() {
            const mins = Math.floor(state.levelTimeLeft / 60);
            const secs = state.levelTimeLeft % 60;
            levelTimerDisplay.textContent = `⏱️ ${mins}:${secs.toString().padStart(2, '0')}`;
            turnTimerDisplay.textContent = state.turnTimeLeft;
            if (state.turnTimeLeft <= 5) {
                turnTimerDisplay.classList.add('warning');
            } else {
                turnTimerDisplay.classList.remove('warning');
            }
        }

        function resetTurnTimer() {
            state.turnTimeLeft = TURN_TIME_LIMIT;
            state.turnTimerActive = state.isPlayerTurn && !state.gameOver && !state.levelComplete;
            updateTimerDisplays();
        }

        // ============================================================
        //  RENDER
        // ============================================================
        function renderWord(word, highlightIndex = null, highlightType = null) {
            wordDisplay.innerHTML = '';
            const chars = word.split('');
            chars.forEach((ch, idx) => {
                const tile = document.createElement('span');
                tile.className = 'letter-tile';
                tile.textContent = ch.toUpperCase();
                if (highlightIndex !== null && idx === highlightIndex) {
                    tile.classList.add(highlightType === 'remove' ? 'highlight-remove' : 'highlight-add');
                }
                if (state.isPlayerTurn && !state.gameOver && !state.isProcessing && !state.levelComplete) {
                    tile.classList.add('clickable');
                    tile.addEventListener('click', () => {
                        const current = state.currentWord;
                        const newWord = current.slice(0, idx) + current.slice(idx + 1);
                        wordInput.value = newWord;
                        wordInput.focus();
                        renderWord(state.currentWord, idx, 'remove');
                        setMessage('Type a letter to insert', 'info');
                    });
                }
                wordDisplay.appendChild(tile);
            });
        }

        function renderUsedWords() {
            const words = state.usedWords;
            usedWordsEl.innerHTML = '<span class="used-words-label">📝 used:</span>';
            const displayWords = words.slice(-12);
            displayWords.forEach((w, i) => {
                const tag = document.createElement('span');
                tag.className = 'used-word-tag';
                if (i === displayWords.length - 1) tag.classList.add('current');
                tag.textContent = w;
                usedWordsEl.appendChild(tag);
            });
        }

        function updateStats() {
            playerScoreEl.textContent = state.playerScore;
            computerScoreEl.textContent = state.computerScore;
            moveCounter.textContent = `Moves ${state.moves}`;
        }

        function updateLevelUI() {
            const config = getLevelConfig();
            levelNum.textContent = config.level;
            levelLetters.textContent = config.wordLength;
            // Update progress
            const done = state.wordsCompleted;
            const needed = getWordsNeeded();
            progressCount.textContent = `${done} / ${needed}`;
            const pct = Math.min(100, (done / needed) * 100);
            progressFill.style.width = `${pct}%`;
            levelStatus.textContent = `Level ${config.level}`;
            // Re-fetch timer span for level timer (updated via interval)
        }

        function updateTurn() {
            if (state.gameOver) {
                turnIndicator.textContent = '⏹ Game Over';
                turnIndicator.className = 'turn-indicator';
                return;
            }
            if (state.levelComplete) {
                turnIndicator.textContent = '🎉 Level Complete!';
                turnIndicator.className = 'turn-indicator';
                return;
            }
            turnIndicator.textContent = state.isPlayerTurn ? '● Your Turn' : '○ Computer Thinking…';
            turnIndicator.className = 'turn-indicator ' + (state.isPlayerTurn ? 'player-turn' : 'computer-turn');
        }

        function setMessage(text, type = 'info') {
            state.message = text;
            state.messageType = type;
            messageEl.textContent = text;
            messageEl.className = 'message ' + type;
        }

        function setGameOver(title, sub) {
            state.gameOver = true;
            clearTimer();
            gameOverOverlay.classList.add('visible');
            celebration.classList.remove('visible');
            gameOverTitle.textContent = title;
            gameOverSub.textContent = sub;
            turnIndicator.textContent = '⏹ Game Over';
            turnIndicator.className = 'turn-indicator';
            wordInput.disabled = true;
            submitBtn.disabled = true;
            hintBtn.disabled = true;
            turnTimerDisplay.textContent = '0';
            turnTimerDisplay.classList.remove('warning');
            levelTimerDisplay.textContent = '⏱️ 0:00';
        }

        function clearGameOver() {
            gameOverOverlay.classList.remove('visible');
            celebration.classList.remove('visible');
            wordInput.disabled = false;
            submitBtn.disabled = false;
            hintBtn.disabled = false;
        }

        // ============================================================
        //  LEVEL MANAGEMENT
        // ============================================================
        function startLevel() {
            const config = getLevelConfig();
            const length = config.wordLength;
            const words = getWordsOfLength(length);

            let seed = words[Math.floor(Math.random() * words.length)];
            let attempts = 0;
            while (attempts < 50) {
                const neighbors = getNeighbors(seed);
                if (neighbors.length > 0) break;
                seed = words[Math.floor(Math.random() * words.length)];
                attempts++;
            }

            state.currentWord = seed;
            state.wordsCompleted = 0;
            state.usedWords = [seed];
            state.isPlayerTurn = true;
            state.levelComplete = false;
            state.gameOver = false;
            state.isProcessing = false;
            state.hint = null;

            clearGameOver();
            clearTimer();
            wordInput.value = '';
            wordInput.disabled = false;
            submitBtn.disabled = false;
            hintBtn.disabled = false;

            renderWord(seed);
            renderUsedWords();
            updateStats();
            updateLevelUI();
            updateTurn();
            state.levelTimeLeft = getLevelTimeLimit();
            state.turnTimeLeft = TURN_TIME_LIMIT;
            state.turnTimerActive = true;
            startTimers();
            setMessage(`Level ${config.level} – ${length}‑letter words. You have 30s per turn!`, 'info');
            wordInput.focus();
        }

        function completeLevel() {
            state.levelComplete = true;
            clearTimer();
            setMessage('🎉 Level Complete!', 'level-up');

            if (state.levelIndex >= MAX_LEVEL - 1) {
                state.allLevelsComplete = true;
                state.gameOver = true;
                gameOverOverlay.classList.remove('visible');
                celebration.classList.add('visible');
                turnIndicator.textContent = '🏆 You Win!';
                turnIndicator.className = 'turn-indicator';
                wordInput.disabled = true;
                submitBtn.disabled = true;
                hintBtn.disabled = true;
                setMessage('🌟 All levels complete – you\'re a champion!', 'game-over');
                return;
            }

            state.isProcessing = true;
            setTimeout(() => {
                state.levelIndex++;
                state.isProcessing = false;
                startLevel();
            }, 2000);
        }

        // ============================================================
        //  GAME LOGIC
        // ============================================================
        function makePlayerMove(newWord) {
            if (state.gameOver || !state.isPlayerTurn || state.isProcessing || state.levelComplete) return false;

            const current = state.currentWord;
            const lower = newWord.toLowerCase().trim();

            if (lower.length !== current.length) {
                setMessage(`Word must be ${current.length} letters`, 'error');
                return false;
            }
            if (lower === current) {
                setMessage('Must be different!', 'error');
                return false;
            }
            if (!isWord(lower)) {
                setMessage(`"${lower}" is not a valid word`, 'error');
                return false;
            }

            let diffCount = 0;
            for (let i = 0; i < current.length; i++) {
                if (current[i] !== lower[i]) diffCount++;
            }
            if (diffCount !== 1) {
                setMessage('Change exactly one letter', 'error');
                return false;
            }
            if (state.usedWords.includes(lower)) {
                setMessage(`"${lower}" already used`, 'error');
                return false;
            }

            state.currentWord = lower;
            state.usedWords.push(lower);
            state.playerScore++;
            state.moves++;
            state.wordsCompleted++;
            state.isPlayerTurn = false;
            state.hint = null;
            state.turnTimerActive = false;

            renderWord(lower);
            renderUsedWords();
            updateStats();
            updateLevelUI();
            updateTurn();
            wordInput.value = '';
            setMessage(`✅ "${lower}" — Great!`, 'success');

            if (state.wordsCompleted >= getWordsNeeded()) {
                completeLevel();
                return true;
            }

            state.isProcessing = true;
            setTimeout(() => {
                makeComputerMove();
            }, 700);

            return true;
        }

        function makeComputerMove() {
            if (state.gameOver || state.levelComplete) {
                state.isProcessing = false;
                return;
            }

            const current = state.currentWord;
            const usedSet = new Set(state.usedWords);
            const moves = getValidMoves(current, usedSet);

            if (moves.length === 0) {
                state.isProcessing = false;
                const length = getWordLength();
                const words = getWordsOfLength(length);
                let newSeed = words.find(w => !state.usedWords.includes(w) && getValidMoves(w, usedSet).length > 0);
                if (!newSeed) {
                    setMessage('🎉 Computer stuck! Level complete!', 'level-up');
                    completeLevel();
                    return;
                }
                state.currentWord = newSeed;
                state.usedWords.push(newSeed);
                state.playerScore++;
                state.wordsCompleted++;
                state.isPlayerTurn = true;
                state.isProcessing = false;
                renderWord(newSeed);
                renderUsedWords();
                updateStats();
                updateLevelUI();
                updateTurn();
                state.turnTimeLeft = TURN_TIME_LIMIT;
                state.turnTimerActive = true;
                setMessage(`✨ Computer couldn't move! New word: "${newSeed}"`, 'info');
                if (state.wordsCompleted >= getWordsNeeded()) {
                    completeLevel();
                }
                return;
            }

            let bestMoves = moves;
            let bestScore = -1;
            for (const m of moves) {
                const nextUsed = new Set(usedSet);
                nextUsed.add(m);
                const nextMoves = getValidMoves(m, nextUsed);
                const score = nextMoves.length;
                if (score > bestScore) { bestScore = score; bestMoves = [m]; }
                else if (score === bestScore) bestMoves.push(m);
            }
            const chosen = bestMoves[Math.floor(Math.random() * bestMoves.length)];

            state.currentWord = chosen;
            state.usedWords.push(chosen);
            state.computerScore++;
            state.moves++;
            state.isPlayerTurn = true;
            state.isProcessing = false;
            state.hint = null;
            state.turnTimerActive = true;
            state.turnTimeLeft = TURN_TIME_LIMIT;

            renderWord(chosen);
            renderUsedWords();
            updateStats();
            updateLevelUI();
            updateTurn();
            setMessage(`🤖 Computer plays "${chosen.toUpperCase()}"`, 'info');

            const usedSet2 = new Set(state.usedWords);
            const playerMoves = getValidMoves(chosen, usedSet2);
            if (playerMoves.length === 0 && state.wordsCompleted < getWordsNeeded()) {
                const length = getWordLength();
                const words = getWordsOfLength(length);
                let newSeed = words.find(w => !state.usedWords.includes(w) && getValidMoves(w, usedSet2).length > 0);
                if (!newSeed) {
                    setMessage('😔 No moves available. Try again!', 'error');
                    setGameOver('💻 Computer Wins!', 'No moves available.');
                    return;
                }
                state.currentWord = newSeed;
                state.usedWords.push(newSeed);
                state.playerScore++;
                state.wordsCompleted++;
                renderWord(newSeed);
                renderUsedWords();
                updateStats();
                updateLevelUI();
                setMessage(`✨ New word for you: "${newSeed}"`, 'info');
                if (state.wordsCompleted >= getWordsNeeded()) {
                    completeLevel();
                    return;
                }
                state.turnTimeLeft = TURN_TIME_LIMIT;
                state.turnTimerActive = true;
                wordInput.focus();
                return;
            }

            wordInput.focus();
        }

        // ============================================================
        //  HINT
        // ============================================================
        function giveHint() {
            if (state.gameOver || !state.isPlayerTurn || state.isProcessing || state.levelComplete) return;
            const usedSet = new Set(state.usedWords);
            const moves = getValidMoves(state.currentWord, usedSet);
            if (moves.length === 0) {
                setMessage('No moves available!', 'error');
                return;
            }
            const hint = moves[Math.floor(Math.random() * moves.length)];
            setMessage(`💡 Try "${hint.toUpperCase()}"`, 'info');
            let diffIdx = -1;
            for (let i = 0; i < state.currentWord.length; i++) {
                if (state.currentWord[i] !== hint[i]) { diffIdx = i; break; }
            }
            if (diffIdx !== -1) {
                renderWord(state.currentWord, diffIdx, 'add');
                setTimeout(() => renderWord(state.currentWord), 800);
            }
        }

        // ============================================================
        //  EVENT HANDLERS
        // ============================================================
        submitBtn.addEventListener('click', () => {
            const val = wordInput.value.trim();
            if (!val) { setMessage('Please enter a word', 'error'); return; }
            makePlayerMove(val);
        });

        wordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); submitBtn.click(); }
            if (e.key.length === 1 || e.key === 'Backspace') {
                renderWord(state.currentWord);
            }
        });

        hintBtn.addEventListener('click', giveHint);

        restartBtn.addEventListener('click', () => {
            state.levelIndex = 0;
            state.playerScore = 0;
            state.computerScore = 0;
            state.moves = 0;
            state.allLevelsComplete = false;
            startLevel();
        });

        // ============================================================
        //  INIT
        // ============================================================
        startLevel();
        console.log('⚡ Letter Rush – Colourful Edition loaded!');
        console.log(`📚 ${WORD_SET.size} words (3-6 letters)`);
        console.log(`⏱️ ${TURN_TIME_LIMIT}s per turn, 2 min per level`);
    </script>
</body>
</html>
